# MarbleScape wallpaper configuration
# EUMETSAT layer order is bottom to top. Restart after manual changes.

[source]
provider = "eumetsat"          # eumetsat, goes_east, goes_west, solar, himawari, slider, copernicus, or worldview
check_for_updates = true        # false downloads once, then reuses the matching local image.

# Each source keeps its own selection when switching providers.
# NOAA selections always use the latest published still image.
# Auto chooses the smallest offered source that avoids upscaling the output.
[sources.eumetsat]
theme = "weather_monitoring"
satellite = "MTG - 0 Degree"
mission = "MTG"
product_type = "RGB Composites"
layer = "mtg_fd:rgb_geocolour"
orbit_type = "GEO"             # Catalogue metadata retained with the selected layer.
fill_gaps = false               # Available only for suitable LEO single-overpass layers.
gap_fill_lookback_hours = 12    # 12 or 24; only transparent No Data pixels are filled.

[sources.goes_east]
area = "full_disk"
product = "GEOCOLOR"
resolution = "auto"           # auto, largest, or a size offered in Settings.

[sources.goes_west]
area = "full_disk"
product = "GEOCOLOR"
resolution = "auto"

[sources.solar]
area = "sun"
product = "Fe171"
resolution = "auto"

[sources.himawari]
area = "nict_full_disk"
product = "true_color"
resolution = "auto"

# CIRA SLIDER satellite/sector and product tiles are always the newest still image.
# Map borders and latitude/longitude lines are separate SLIDER overlays and are not downloaded.
[sources.slider]
area = "goes-19---full_disk"
product = "geocolor"
resolution = "auto"

# NASA Worldview is accessed through the public GIBS WMTS catalogue and WMS image service.
# area is the GIBS visualization layer; product is "latest" or a listed fixed date.
[sources.worldview]
area = "VIIRS_NOAA20_CorrectedReflectance_TrueColor"
product = "latest"
resolution = "auto"

# Copernicus Browser configuration. Date "latest" resolves the newest
# acquisition available at the selected latitude/longitude.
[sources.copernicus]
configuration = "DEFAULT-THEME"
mission = "Sentinel-2 Mosaics"
product = "MARBLESCAPE::S2-QUARTERLY"
layer = "TRUE_COLOR_CLOUDLESS"
highlight = ""
date = "latest"
latitude = 51.1657
longitude = 10.4515
map_zoom = 7
map_labels = true
coverage_mode = "single"
# Supported maximum lookback values: 3, 7, 14, 21, 30, 45, 60, 90, 120, 180, 270, 365, 550, 730, 920, or 1095 days.
lookback_days = 14
# Optical layers: maximum tile cloud cover, 0-100 in 5% steps. Unsupported layers ignore it.
max_cloud_cover = 30
# Copernicus mosaic brightness: 25-200 in 5% steps; 100 uses the calibrated default.
brightness = 100

# Create a free OAuth client under User Settings > OAuth clients at:
# https://shapps.dataspace.copernicus.eu/dashboard/#/account/settings
# The Process API used by MarbleScape does not require a Configuration Instance.
# Settings writes client_secret_protected as a per-user Windows DPAPI value.
[copernicus]
client_id = ""
client_secret_protected = ""

# Endpoint, WMS version, archive time, and render mode apply to EUMETSAT.
# Update interval, timeout, and continuous operation apply to all sources.
[service]
endpoint = "https://view.eumetsat.int/geoserver/wms"
version = "1.3.0"
time = ""                       # Empty selects the latest available imagery.
update_interval_minutes = 5.0
timeout_seconds = 90
run_continuously = true
render_mode = "auto"            # auto, server, or local

[download]
show_speed = true
speed_unit = "automatic"        # automatic, KB/s, MB/s, or Mbit/s
show_progress = true             # Percentage and transferred/total size when known.
show_progress_bar = true         # Indeterminate when the server gives no total size.
keep_completed_visible = false   # Keep the successful result visible until the next download.
retries = 2                      # 1-9 retries after the first attempt (2-10 total attempts).
catalogue_retries = 2            # 1-9 retries after the first catalogue attempt; cached data is used if needed.

[output]
latest_folder = ""             # Empty = root/content/latest; relative to the script folder.
width = 2560
height = 0                      # 0 derives height from aspect_ratio.
aspect_ratio = "16:9"
render_scale = "auto"           # EUMETSAT WMS only: auto, or 1.0, 1.25, 1.5, 2.0.
background_color = "#000000"
windows_root = "."              # Relative to the application folder; absolute is allowed.
linux_root = "."

[view]
# Fit mode and zoom apply to EUMETSAT, NOAA, Himawari, CIRA SLIDER, and NASA Worldview. Copernicus uses its
# own latitude, longitude, and map_zoom. Projections, presets, and the
# TrueColor night option apply only to EUMETSAT.
# Available projections: Geographic, GEOS: MSG FES, MTG FD, GEOS: MSG RSS,
# GEOS: MSG IODC, Spherical Mercator, North Polar, South Polar.
# All seven official EUMETSAT viewer projections are shown in Settings.
# Regional presets still use Geographic. Other projections apply to full_earth
# or custom. Use fit_mode="crop" for Geographic full_earth at screen ratios.
projection = "GEOS: MSG FES, MTG FD"
preset = "full_earth"           # full_earth, europe, mediterranean,
                                # central_europe, or custom
fit_mode = "fit"                # fit or crop
zoom = 1.1
truecolor_black_night = false  # Applies only to MTG TrueColor.
# For preset="custom", use logical x/y order in the selected projection:
# bbox = [-6500000.0, -6500000.0, 6500000.0, 6500000.0]
# With projection="Geographic": bbox = [west, south, east, north]

[history]
folder = ""                    # Empty = root/content/history; relative to the script folder.
enabled = false
retention_mode = "count"        # count, time, or both
max_files = 100
years = 0
months = 0
days = 1
hours = 0
minutes = 0

[windows]
set_wallpaper = true
position = "fit"                # center, tile, stretch, fit, fill, span, or none
monitor_positions = "{}"       # Per-monitor overrides are saved by the settings dialog.
monitor_output_settings = "{}" # Per-monitor size, quality and color overrides.
pause_on_error = true

[display]
time_zone = "system"            # system (recommended) or utc; display only

[updates]
skipped_version = ""            # Latest release dismissed from the startup notice.

[profile_list]
visible_columns = ["name", "source", "selection", "time", "location", "latitude", "longitude", "coverage"]

# These WMS layers apply only to EUMETSAT and are retained for later use.
# Friendly basemap choices. Normally enable exactly one.
[[layers]]
kind = "basemap"
name = "Natural Earth"
enabled = true
opacity = 1.0
style = ""

[[layers]]
kind = "basemap"
name = "OSM Dark"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "basemap"
name = "OSM Light"
enabled = false
opacity = 1.0
style = ""

# Exact WMS product names come from --list-layers or --export-layers.
[[layers]]
kind = "wms"
name = "mtg_fd:rgb_geocolour"
enabled = true
opacity = 1.0
style = ""
# time = "latest"               # Or an ISO-8601 archive timestamp.

# Friendly overlay choices.
[[layers]]
kind = "overlay"
name = "Coastlines"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Boundaries"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Labels (dark)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Labels (light)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Graticules (dark)"
enabled = false
opacity = 1.0
style = ""

[[layers]]
kind = "overlay"
name = "Graticules (light)"
enabled = false
opacity = 1.0
style = ""
